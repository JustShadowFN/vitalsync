version: "3.9"

# Réseau personnalisé bridge dédié au projet.
# Avantage par rapport au réseau par défaut : les conteneurs sont isolés
# des autres projets Docker tournant sur la même machine. Seuls les services
# déclarés dans ce fichier peuvent communiquer entre eux par leur nom.
networks:
  vitalsync-net:
    driver: bridge

# Volume persistant pour PostgreSQL.
# Sans ce volume : toutes les données sont perdues dès qu'on fait docker-compose down.
# Avec ce volume : les données survivent aux redémarrages et aux recreations de conteneur.
volumes:
  postgres-data:

services:

  backend:
    build: ./backend
    container_name: vitalsync-backend
    environment:
      - NODE_ENV=production
      - DB_HOST=database
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB}
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
    networks:
      - vitalsync-net
    ports:
      - "3000:3000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build: ./frontend
    container_name: vitalsync-frontend
    networks:
      - vitalsync-net
    ports:
      - "80:80"
    depends_on:
      - backend

  database:
    image: postgres:16-alpine
    container_name: vitalsync-db
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - vitalsync-net
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
