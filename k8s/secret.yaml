# Secret Kubernetes pour les credentials de la base de données.
# Les valeurs sont encodées en base64 (stringData fait l'encodage automatiquement).
# IMPORTANT : ce fichier ne doit jamais être commité tel quel en production.
# En production, utiliser un gestionnaire de secrets (Vault, Sealed Secrets, External Secrets).
apiVersion: v1
kind: Secret
metadata:
  name: vitalsync-db-secret
type: Opaque
stringData:
  POSTGRES_PASSWORD: "change_me_in_production"
  POSTGRES_USER: "vitalsync_user"
  POSTGRES_DB: "vitalsync"
