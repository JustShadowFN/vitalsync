server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Servir l'application React (SPA)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy vers le back-end pour toutes les requêtes /api/*
    # Le front-end n'a pas besoin de connaître l'adresse du back-end :
    # Nginx fait le relais de manière transparente pour le navigateur.
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
